<style>
:root{--bg:#101a2c;--card:#18263d;--line:#2a3c5a;--ink:#e8eef7;--mute:#9db0cc;--acc:#ffb43b;--accink:#241800;--bad:#ff7a7a}
@media (prefers-color-scheme:light){:root{--bg:#f2f5fa;--card:#fff;--line:#d5deeb;--ink:#14213a;--mute:#566a8a;--acc:#e08a00;--accink:#fff}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,Segoe UI,sans-serif}
h1,h2,h3,.brand{font-family:'Bricolage Grotesque',system-ui,sans-serif;line-height:1.15;margin:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px max(20px,5vw);border-bottom:1px solid var(--line)}
.brand{font-size:1.3rem;font-weight:800;text-decoration:none;display:flex;align-items:center;gap:10px}
.logo{width:40px;height:40px;border-radius:10px}
nav{display:flex;gap:18px}
nav a{text-decoration:none;color:var(--mute);font-weight:500}
nav a.on,nav a:hover{color:var(--ink)}
main{max-width:1000px;margin:0 auto;padding:36px 20px 80px}
.top{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:28px;flex-wrap:wrap}
.top h1{font-size:clamp(2rem,6vw,3.4rem);font-weight:800}
.top p{color:var(--mute);margin:8px 0 0;max-width:46ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;text-decoration:none;display:flex;flex-direction:column}
.card:hover{border-color:var(--acc)}
.thumb{aspect-ratio:16/9;background:var(--line);object-fit:cover;width:100%;display:block}
.card div{padding:14px 16px 18px}
.card h3{font-size:1.15rem;font-weight:700}
.card p{margin:6px 0 0;color:var(--mute);font-size:.93rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.btn{border:0;border-radius:10px;padding:10px 18px;font:inherit;font-weight:700;cursor:pointer;background:var(--acc);color:var(--accink);text-decoration:none;display:inline-block}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.del{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.plus{width:54px;height:54px;border-radius:50%;font-size:2rem;line-height:1;padding:0}
.empty{border:1px dashed var(--line);border-radius:14px;padding:40px 20px;text-align:center;color:var(--mute)}
.detail h1{font-size:clamp(1.8rem,5vw,2.8rem);font-weight:800}
.detail .link{color:var(--acc);word-break:break-all}
.desc{white-space:pre-wrap;max-width:68ch;margin:20px 0}
.media{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin:24px 0}
.media img,.media video{width:100%;border-radius:12px;border:1px solid var(--line);background:#000}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.creator{display:flex;gap:28px;align-items:center;flex-wrap:wrap}
.photo{width:200px;height:200px;border-radius:50%;object-fit:cover;object-position:center 20%;background:var(--card);border:3px solid var(--acc);display:grid;place-items:center;font:800 3.4rem 'Bricolage Grotesque',sans-serif;color:var(--acc)}
dialog{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:16px;width:min(480px,92vw);padding:24px}
dialog::backdrop{background:rgba(0,0,0,.6)}
label{display:block;font-weight:600;margin:14px 0 6px}
input,textarea{width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit}
textarea{min-height:100px;resize:vertical}
.msg{color:var(--bad);min-height:1.4em;margin:10px 0 0;font-size:.92rem}
footer{text-align:center;color:var(--mute);padding:20px;font-size:.9rem}
footer button{background:none;border:0;color:var(--mute);cursor:pointer;font:inherit;text-decoration:underline}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}}
</style>
</head>

/* ===================================== */

const CREATOR_NAME = "Sairaj Dilip Vernekar";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl = u => /^https?:\/\//i.test(u) ? u : "#";
let isOwner = false, sites = [], loadErr = "";

async function loadSites() {
  const { data, error } = await sb.from("sites").select("*").order("created_at", { ascending: false });
  loadErr = error ? "Could not load websites. Check your Supabase settings." : "";
  sites = data || [];
}
async function refreshOwner() {
  const { data: { session } } = await sb.auth.getSession();
  isOwner = !!session && session.user.id === OWNER_ID;
  render();
}
sb.auth.onAuthStateChange(() => refreshOwner());

const isVideo = m => m.type === "video";
const thumbOf = s => (s.media || []).find(m => !isVideo(m));

function render() {
  const h = location.hash || "#/";
  $("n-home").className = h === "#/" ? "on" : "";
  $("n-creator").className = h === "#/creator" ? "on" : "";
  $("foot").innerHTML = isOwner
    ? 'Logged in as owner · <button id="outBtn">Log out</button>'
    : '<button id="inBtn">Owner login</button>';
  const out = $("outBtn"), inn = $("inBtn");
  if (out) out.onclick = () => sb.auth.signOut();
  if (inn) inn.onclick = () => { $("loginMsg").textContent = ""; $("loginDlg").showModal(); };

  if (h === "#/creator") return renderCreator();
  if (h.startsWith("#/site/")) return renderSite(h.slice(7));
  renderHome();
}

function renderHome() {
  const cards = sites.map(s => {
    const t = thumbOf(s);
    return `<a class="card" href="#/site/${esc(s.id)}">
      ${t ? `<img class="thumb" src="${esc(t.url)}" alt="" loading="lazy">` : `<div class="thumb"></div>`}
      <div><h3>${esc(s.title)}</h3><p>${esc(s.description)}</p></div></a>`;
  }).join("");
  $("app").innerHTML = `
    <div class="top">
      <div><h1>Games and sites I've found</h1><p>Open any card to read about it and visit the website.</p></div>
      ${isOwner ? `<button class="btn plus" id="plusBtn" aria-label="Add a website" title="Add a website">+</button>` : ""}
    </div>
    ${loadErr ? `<p class="msg">${esc(loadErr)}</p>` : ""}
    ${sites.length ? `<div class="grid">${cards}</div>` : `<div class="empty">Nothing here yet.${isOwner ? " Press + to add the first website." : ""}</div>`}`;
  const p = $("plusBtn");
  if (p) p.onclick = () => { $("addMsg").textContent = ""; $("addDlg").showModal(); };
}

function renderSite(id) {
  const s = sites.find(x => x.id === id);
  if (!s) { $("app").innerHTML = `<div class="empty">Website not found. <a href="#/">Back to home</a></div>`; return; }
  const media = (s.media || []).map(m => isVideo(m)
    ? `<video src="${esc(m.url)}" controls preload="metadata"></video>`
    : `<img src="${esc(m.url)}" alt="${esc(s.title)}" loading="lazy">`).join("");
  $("app").innerHTML = `<div class="detail">
    <p><a href="#/">← All websites</a></p>
    <h1>${esc(s.title)}</h1>
    <p><a class="link" href="${esc(safeUrl(s.url))}" target="_blank" rel="noopener noreferrer">${esc(s.url)}</a></p>
    <div class="desc">${esc(s.description) || "No description yet."}</div>
    ${media ? `<div class="media">${media}</div>` : ""}
    <div class="row">
      <a class="btn" href="${esc(safeUrl(s.url))}" target="_blank" rel="noopener noreferrer">Open website</a>
      ${isOwner ? `<button class="btn del" id="delBtn">Delete</button>` : ""}
    </div></div>`;
  const d = $("delBtn");
  if (d) d.onclick = async () => {
    if (!confirm("Delete this website from the shelf?")) return;
    const { error } = await sb.from("sites").delete().eq("id", s.id);
    if (error) return alert("Delete failed: " + error.message);
    await loadSites(); location.hash = "#/";
  };
}

function renderCreator() {
  const initials = CREATOR_NAME.split(" ").map(w => w[0]).slice(0, 2).join("");
  $("app").innerHTML = `<div class="creator">
    <img class="photo" id="cp" src="${esc(CREATOR_PHOTO)}" alt="Photo of ${esc(CREATOR_NAME)}">
    <div><h1>${esc(CREATOR_NAME)}</h1>
    <p style="color:var(--mute);max-width:46ch">Creator of this site. I collect games and websites worth sharing and write down what each one is about.</p></div></div>`;
  $("cp").onerror = e => { const d = document.createElement("div"); d.className = "photo"; d.textContent = initials; e.target.replaceWith(d); };
}

/* Dialog helpers */
document.querySelectorAll("[data-close]").forEach(b => b.onclick = () => $(b.dataset.close).close());

/* Owner login */
$("loginGo").onclick = async () => {
  const { data, error } = await sb.auth.signInWithPassword({ email: $("l-email").value.trim(), password: $("l-pass").value });
  if (error) { $("loginMsg").textContent = error.message; return; }
  if (data.user.id !== OWNER_ID) { await sb.auth.signOut(); $("loginMsg").textContent = "This account is not the site owner."; return; }
  $("l-pass").value = ""; $("loginDlg").close();
};

/* Add website (owner only; the database enforces this too) */
$("addSave").onclick = async () => {
  const msg = $("addMsg"), btn = $("addSave");
  const title = $("f-title").value.trim(), url = $("f-url").value.trim(), description = $("f-desc").value.trim();
  if (!title || !/^https?:\/\//i.test(url)) { msg.textContent = "Enter a name and a link starting with http:// or https://"; return; }
  btn.disabled = true; msg.textContent = "Saving…";
  try {
    const media = [];
    for (const f of $("f-files").files) {
      const path = `${Date.now()}-${Math.random().toString(36).slice(2, 8)}-${f.name.replace(/[^\w.-]/g, "_")}`;
      const { error } = await sb.storage.from("media").upload(path, f);
      if (error) throw error;
      media.push({ url: sb.storage.from("media").getPublicUrl(path).data.publicUrl, type: f.type.startsWith("video") ? "video" : "image" });
    }
    const { error } = await sb.from("sites").insert({ title, url, description, media });
    if (error) throw error;
    ["f-title", "f-url", "f-desc", "f-files"].forEach(i => $(i).value = "");
    await loadSites(); $("addDlg").close(); render();
  } catch (e) { msg.textContent = "Could not save: " + (e.message || e); }
  btn.disabled = false;
};

window.addEventListener("hashchange", render);
(async () => { await loadSites(); await refreshOwner(); })();
</script>
</body>
